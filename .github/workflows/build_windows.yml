name: Compilar Ejecutable para Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite compilar manualmente con un clic en GitHub Actions

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar aplicación a ejecutable de inicio instantáneo (--onedir)
        run: |
          pyinstaller --clean --name "SerieDeTaylor" --onedir --windowed --exclude-module scipy --exclude-module pytest --exclude-module unittest --exclude-module tkinter main.py

      - name: Comprimir paquete portable para descarga rápida
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SerieDeTaylor -DestinationPath dist/SerieDeTaylor-Windows-Portable.zip

      - name: Subir paquete SerieDeTaylor-Windows-Portable.zip
        uses: actions/upload-artifact@v4
        with:
          name: SerieDeTaylor-Windows-Portable
          path: dist/SerieDeTaylor-Windows-Portable.zip
